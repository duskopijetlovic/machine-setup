# ~/.config/environment.d/myenv.conf
# Session-wide environment variables for GNOME-Wayland.
# Visible to ALL apps in the GNOME session (replaces ~/.xsessionrc / ~/.xprofile).
# Deploy: mkdir -p ~/.config/environment.d && cp myenv.conf ~/.config/environment.d/myenv.conf
# Apply:  log out and back in (or: export VAR=val && systemctl --user import-environment VAR)

EDITOR=vi
VISUAL=vi
MANWIDTH=80

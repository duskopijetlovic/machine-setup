# ~/.config/environment.d/myenv.conf
# Session-wide environment variables for GNOME-Wayland.
# Visible to ALL apps in the GNOME session (replaces ~/.xsessionrc / ~/.xprofile).
# Reason: systemd-native approach -- supersedes SysV/X11-era display manager sourcing.
#
# See also: doc/rhel10-gnome-wayland-setup-runbook.txt, STEP 1

EDITOR=vi
VISUAL=vi
MANWIDTH=80

# 60-keyboard-layout-multi.conf — three keyboard layouts for the FreeBSD/
# X11/FVWM3 machines: English (US), Serbian Latin, Serbian Cyrillic.
# Toggle between them with Alt+Shift (grp:alt_shift_toggle, below).
#
# Mirrors wayland/gnome/keyboard-layouts.sh on the GNOME/Wayland machines
# (same three layouts, same variant). GNOME uses its own switcher
# keybinding instead of an XKB grp: option -- see that script's NOTES
# for the equivalent there.
#
# Deploy (system-wide, requires root):
#   sudo ln -s ~/machine-setup/x11/60-keyboard-layout-multi.conf \
#     /usr/local/etc/X11/xorg.conf.d/60-keyboard-layout-multi.conf
# Symlinked rather than copied, consistent with the rest of this repo --
# edits here take effect on next X restart with nothing to keep in sync.
# (This is the one x11/ file that lives outside $HOME; every other x11/
# file symlinks into ~ per the usual mechanism.)
#
# Apply without a full restart: restart X, or log out and back in.
#
# Verify after restart:
#   setxkbmap -query
#
Section    "InputClass"
    Identifier    "All Keyboards"
    MatchIsKeyboard    "yes"
    Option    "XkbLayout" "us, rs(latinunicode), rs"
    Option    "XkbOptions" "grp:alt_shift_toggle"
EndSection
